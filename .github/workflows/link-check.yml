name: Link Check

on:
  push:
    branches: [main]
    paths: ["README.md", "CONTRIBUTING.md"]
  pull_request:
    paths: ["README.md", "CONTRIBUTING.md"]
  schedule:
    # Weekly sweep to catch links that died since the last edit
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --accept 200..=206,403,429
            --exclude-path .github
            README.md CONTRIBUTING.md
          fail: true

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check failed: dead links detected"
          content-filepath: ./lychee/out.md
          labels: link-rot, automated
