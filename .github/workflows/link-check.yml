name: Link Check

on:
  push:
    branches: [main]
    paths: ["README.md", "CONTRIBUTING.md", ".github/workflows/link-check.yml"]
  pull_request:
    paths: ["README.md", "CONTRIBUTING.md", ".github/workflows/link-check.yml"]
  schedule:
    # Weekly sweep to catch links that died since the last edit
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    env:
      # sciencedirect.com intermittently bot-blocks lychee with 400s
      # (false positives) — its links are verified manually instead
      # generous timeout + retries: slow hosts (e.g. easss.upb.ro) and
      # transient runner network blips otherwise fail runs on live links
      LYCHEE_ARGS: >-
        --no-progress
        --cache
        --max-cache-age 1d
        --timeout 45
        --max-retries 4
        --retry-wait-time 5
        --accept 200..=206,403,429
        --exclude '^https://www\.sciencedirect\.com'
        --exclude-path .github
        README.md CONTRIBUTING.md
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: false

      # Outages lasting minutes outlast the retries above (easss.upb.ro
      # timed out for ~2 min on 2026-10-19), so re-check once after a
      # pause and fail only on links that are still down. lychee never
      # caches failures, so this pass re-requests just the failed links.
      - name: Wait before re-checking failed links
        if: steps.lychee.outputs.exit_code != 0
        run: sleep 300

      - name: Re-check failed links
        if: steps.lychee.outputs.exit_code != 0
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: true

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check failed: dead links detected"
          content-filepath: ./lychee/out.md
          labels: link-rot, automated

      - name: Close link-rot issues once links recover
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label link-rot --state open \
            --json number --jq '.[].number' |
          xargs -r -n1 -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" \
            --comment "The scheduled link check is passing again — closing automatically."
